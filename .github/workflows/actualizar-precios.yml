name: Actualizar precios SNIIM

on:
  schedule:
    # Miércoles 15:00 UTC (09:00 hora del centro de México)
    - cron: "0 15 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar últimos 14 días y regenerar JSON
        run: python recolector/sniim.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: actualización SNIIM $(date -u +%F)"
            git push
          fi
