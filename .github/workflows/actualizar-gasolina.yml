name: Actualizar precios de gasolina

on:
  schedule:
    # Todos los días a las 13:00 UTC (07:00 hora del centro de México)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # No chocar con la actualización semanal del SNIIM, que también hace push.
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar precios vigentes (CNE)
        run: python recolector/gasolina.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gasolina.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: gasolina $(date -u +%F)"
            git pull --rebase
            git push
          fi
