[versions]
workRuntime = "2.12.0"
billing = "8.3.0"
maplibre = "13.7.1"
playServicesAds = "25.5.0"
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
composeBom = "2026.09.00"
# Material 3 Expressive (MaterialExpressiveTheme, MotionScheme, formas, barras flexibles)
material3 = "1.5.0-rc01"
serializationJson = "1.11.0"
coroutines = "1.11.0"
junit = "4.13.2"

[libraries]
# AdMob trae WorkManager 2.7 (Room 2.2), que R8 rompe en release; se fuerza una versión actual.
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }
# Google Play Billing: compra única de ¿A cómo? Plus.
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
# Mapa de gasolineras (MapLibre + mapas de OpenFreeMap: sin clave ni cuenta). Variante OpenGL: la normal
# ("android-sdk") exige Vulkan y Play deja fuera a miles de teléfonos que no lo tienen.
maplibre = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
